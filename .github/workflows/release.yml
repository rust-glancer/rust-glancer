name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Maintain release pull request and GitHub release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Use a PAT so release PRs trigger their normal pull-request workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  build_release_assets:
    name: build-release-assets (${{ matrix.vscode_target }})
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            # VS Code supports glibc 2.28, so build against that ABI instead of the runner's glibc.
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
            rust_target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
            python: python3
          - runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
            rust_target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            python: python3
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            vscode_target: darwin-x64
            python: python3
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            vscode_target: darwin-arm64
            python: python3
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
            python: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          persist-credentials: false
      - name: Install Rust in Linux compatibility container
        if: ${{ matrix.container }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/cargo-cache
        with:
          scope: release-${{ matrix.vscode_target }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: editors/code
      - name: Build and check language server
        run: cargo run --release -p rust-glancer --target "${{ matrix.rust_target }}" -- --help
      - name: Package standalone language server
        run: >-
          ${{ matrix.python }} .github/scripts/package_server_archive.py
          --target "${{ matrix.rust_target }}"
          --version "${{ needs.release_please.outputs.version }}"
      - name: Package VSIX
        run: >-
          npm run package:vsix --
          --skip-build
          --target "${{ matrix.rust_target }}"
          --vscode-target "${{ matrix.vscode_target }}"
          --out "../../dist/rust-glancer-${{ needs.release_please.outputs.version }}-${{ matrix.vscode_target }}.vsix"
        working-directory: editors/code
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ matrix.vscode_target }}
          path: |
            dist/rust-glancer-${{ needs.release_please.outputs.version }}-${{ matrix.vscode_target }}.vsix
            dist/rust-glancer-${{ needs.release_please.outputs.version }}-${{ matrix.rust_target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs:
      - release_please
      - build_release_assets
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Install extension publishers
        run: npm ci
        working-directory: editors/code
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true
      - name: Check release versions
        run: python3 .github/scripts/check_release_versions.py
      - name: Publish platform packages to the VS Code Marketplace
        env:
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "The VSCE_PAT repository secret is not configured." >&2
            exit 1
          fi

          packages=(
            "../../dist/rust-glancer-${RELEASE_VERSION}-linux-x64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-linux-arm64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-darwin-x64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-darwin-arm64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-win32-x64.vsix"
          )

          for package in "${packages[@]}"; do
            if [[ ! -f "$package" ]]; then
              echo "Missing release package: $package" >&2
              exit 1
            fi
          done

          node ./node_modules/@vscode/vsce/vsce publish --skip-duplicate --packagePath "${packages[@]}"
        working-directory: editors/code
      - name: Publish platform packages to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo "The OVSX_PAT repository secret is not configured." >&2
            exit 1
          fi

          packages=(
            "../../dist/rust-glancer-${RELEASE_VERSION}-linux-x64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-linux-arm64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-darwin-x64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-darwin-arm64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-win32-x64.vsix"
          )

          ./node_modules/.bin/ovsx publish --skip-duplicate --packagePath "${packages[@]}"
        working-directory: editors/code
      - name: Attach release assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.vsix dist/*.tar.gz --clobber
