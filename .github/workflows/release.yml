name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Maintain release pull request and GitHub release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Use a PAT so release PRs trigger their normal pull-request workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  build_vsix:
    name: build-vsix (${{ matrix.vscode_target }})
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            vscode_target: darwin-x64
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            vscode_target: darwin-arm64
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/cargo-cache
        with:
          scope: release-${{ matrix.vscode_target }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: editors/code
      - name: Package VSIX
        run: >-
          npm run package:vsix --
          --target "${{ matrix.rust_target }}"
          --vscode-target "${{ matrix.vscode_target }}"
          --out "../../dist/rust-glancer-${{ needs.release_please.outputs.version }}-${{ matrix.vscode_target }}.vsix"
        working-directory: editors/code
      - name: Upload packaged VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: dist/rust-glancer-${{ needs.release_please.outputs.version }}-${{ matrix.vscode_target }}.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs:
      - release_please
      - build_vsix
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Install Marketplace publisher
        run: npm ci
        working-directory: editors/code
      - name: Download packaged VSIX files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - name: Check release versions
        run: python3 .github/scripts/check_release_versions.py
      - name: Publish platform packages to the VS Code Marketplace
        env:
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "The VSCE_PAT repository secret is not configured." >&2
            exit 1
          fi

          packages=(
            "../../dist/rust-glancer-${RELEASE_VERSION}-linux-x64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-linux-arm64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-darwin-x64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-darwin-arm64.vsix"
            "../../dist/rust-glancer-${RELEASE_VERSION}-win32-x64.vsix"
          )

          for package in "${packages[@]}"; do
            if [[ ! -f "$package" ]]; then
              echo "Missing release package: $package" >&2
              exit 1
            fi
          done

          ./node_modules/.bin/vsce publish --skip-duplicate --packagePath "${packages[@]}"
        working-directory: editors/code
      - name: Attach VSIX files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.vsix --clobber
