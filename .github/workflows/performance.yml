name: Performance

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - ".github/scripts/check_lsp_compatibility_liveness.py"
      - ".github/scripts/render_lsp_compatibility_comment.py"
      - ".github/scripts/render_memory_profile_comment.py"
      - ".github/scripts/render_performance_comment.py"
      - ".github/actions/cargo-cache/**"
      - ".github/actions/download-performance-baseline/**"
      - ".github/actions/download-server/**"
      - ".github/workflows/build-server.yml"
      - ".github/workflows/performance.yml"
      - "test_targets/bench_fixtures/fetch-rust-analyzer.sh"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - ".github/scripts/check_lsp_compatibility_liveness.py"
      - ".github/scripts/render_lsp_compatibility_comment.py"
      - ".github/scripts/render_memory_profile_comment.py"
      - ".github/scripts/render_performance_comment.py"
      - ".github/actions/cargo-cache/**"
      - ".github/actions/download-performance-baseline/**"
      - ".github/actions/download-server/**"
      - ".github/workflows/build-server.yml"
      - ".github/workflows/performance.yml"
      - "test_targets/bench_fixtures/fetch-rust-analyzer.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

# Superseded PR commits no longer need runners. Keep every main-branch run so
# cache refreshes and performance baselines can finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-server:
    uses: ./.github/workflows/build-server.yml
    with:
      os: ubuntu-latest

  memory-profile:
    name: memory-profile
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/download-server
        with:
          name: rust-glancer-ubuntu-latest

      - name: Install rust-src
        run: rustup component add rust-src

      - name: Download base memory profile
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/download-performance-baseline
        with:
          artifact-name: memory-profile-baseline
          base-sha: ${{ github.event.pull_request.base.sha }}
          path: .ci/memory/base
          github-token: ${{ github.token }}

      - name: Fetch rust-analyzer fixture
        run: ./test_targets/bench_fixtures/fetch-rust-analyzer.sh

      - name: Run memory profile
        run: |
          mkdir -p .ci/memory/current
          target/release/rust-glancer analyze test_targets/bench_fixtures/rust-analyzer \
            --memory \
            --package-residency all-offloadable \
            --format json > .ci/memory/current/result.json

      - name: Render memory profile section
        run: |
          python3 .github/scripts/render_memory_profile_comment.py \
            --current .ci/memory/current/result.json \
            --base .ci/memory/base/result.json \
            --output .ci/memory/comment.md \
            --section-title "Memory usage analysis"
          cat .ci/memory/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload memory profile section
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-profile-comment
          path: .ci/memory/comment.md

      - name: Upload main-branch memory profile baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-profile-baseline
          path: .ci/memory/current/result.json
          if-no-files-found: error
          retention-days: 30

  lsp-compatibility:
    name: lsp-compatibility
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/download-server
        with:
          name: rust-glancer-ubuntu-latest

      - name: Download base LSP compatibility
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/download-performance-baseline
        with:
          artifact-name: lsp-compatibility-baseline
          base-sha: ${{ github.event.pull_request.base.sha }}
          path: .ci/lsp/base
          github-token: ${{ github.token }}

      - name: Fetch rust-analyzer fixture
        run: ./test_targets/bench_fixtures/fetch-rust-analyzer.sh

      - name: Install rust-analyzer server
        run: rustup component add rust-analyzer

      - name: Run LSP compatibility
        run: |
          mkdir -p .ci/lsp/current
          RUST_GLANCER_COMPARE_LSP_RUST_ANALYZER="$(rustup which rust-analyzer)" \
            target/release/rust-glancer compare-lsp rust_analyzer \
              --path test_targets/bench_fixtures/rust-analyzer \
              --format json > .ci/lsp/current/result.json
          RUST_GLANCER_COMPARE_LSP_RUST_ANALYZER="$(rustup which rust-analyzer)" \
            target/release/rust-glancer compare-lsp rust_analyzer_dirty \
              --path test_targets/bench_fixtures/rust-analyzer \
              --format json > .ci/lsp/current/dirty.json

      - name: Render LSP compatibility section
        run: |
          python3 .github/scripts/render_lsp_compatibility_comment.py \
            --current .ci/lsp/current/result.json \
            --base .ci/lsp/base/result.json \
            --output .ci/lsp/clean-comment.md \
            --section-title "LSP compatibility"
          python3 .github/scripts/render_lsp_compatibility_comment.py \
            --current .ci/lsp/current/dirty.json \
            --base .ci/lsp/base/dirty.json \
            --output .ci/lsp/dirty-comment.md \
            --section-title "Dirty-buffer LSP compatibility"
          cat .ci/lsp/clean-comment.md > .ci/lsp/comment.md
          printf '\n' >> .ci/lsp/comment.md
          cat .ci/lsp/dirty-comment.md >> .ci/lsp/comment.md
          cat .ci/lsp/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LSP compatibility section
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lsp-compatibility-comment
          path: .ci/lsp/comment.md

      - name: Check LSP compatibility liveness
        run: |
          python3 .github/scripts/check_lsp_compatibility_liveness.py \
            --report .ci/lsp/current/result.json
          python3 .github/scripts/check_lsp_compatibility_liveness.py \
            --report .ci/lsp/current/dirty.json

      - name: Upload main-branch LSP compatibility baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lsp-compatibility-baseline
          path: |
            .ci/lsp/current/result.json
            .ci/lsp/current/dirty.json
          if-no-files-found: error
          retention-days: 30

  performance-comment:
    name: performance-comment
    if: github.event_name == 'pull_request'
    needs:
      - memory-profile
      - lsp-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download memory profile section
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memory-profile-comment
          path: .ci/performance/memory

      - name: Download LSP compatibility section
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lsp-compatibility-comment
          path: .ci/performance/lsp

      - name: Render performance comment
        run: |
          python3 .github/scripts/render_performance_comment.py \
            --memory .ci/performance/memory/comment.md \
            --lsp .ci/performance/lsp/comment.md \
            --output .ci/performance/comment.md
          tee -a "$GITHUB_STEP_SUMMARY" < .ci/performance/comment.md

      - name: Comment on pull request
        # Fork pull requests receive a read-only token, so their report stays in the log and summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: rust-glancer-performance
          path: .ci/performance/comment.md
