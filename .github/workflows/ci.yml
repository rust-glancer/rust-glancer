name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lints:
    name: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check release versions
        run: python3 .github/scripts/check_release_versions.py
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-nextest@0.9.132
      - name: Run tests
        run: cargo nextest run --workspace

  test-targets:
    name: test-targets
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/test-targets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target/test-targets
          dependency-key: ${{ hashFiles('rust-toolchain.toml', 'test_targets/**/Cargo.lock', 'test_targets/**/Cargo.toml') }}
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: just@1.48.1
      - name: Check test targets
        run: just check-test-targets

  compare-lsp-windows:
    name: compare-lsp (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Fetch rust-analyzer fixture
        shell: bash
        run: ./test_targets/bench_fixtures/fetch-rust-analyzer.sh
      - name: Install rust-analyzer server
        run: rustup component add rust-analyzer
      - name: Build rust-glancer
        run: cargo build --release --locked -p rust-glancer
      - name: Run LSP comparison
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci/lsp | Out-Null
          $env:RUST_GLANCER_COMPARE_LSP_RUST_ANALYZER = rustup which rust-analyzer
          & ./target/release/rust-glancer.exe compare-lsp rust_analyzer `
            --path test_targets/bench_fixtures/rust-analyzer `
            --format json > .ci/lsp/result.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Check LSP comparison liveness
        run: >-
          python .github/scripts/check_lsp_compatibility_liveness.py
          --report .ci/lsp/result.json

  client:
    name: client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: editors/code
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Check client formatting
        run: npm run fmt:check
      - name: Lint client
        run: npm run lint
      - name: Check client
        run: npm run check
      - name: Check client tests
        run: npm run check:test
      - name: Check client unit tests
        run: npm run check:unit
      - name: Run client unit tests
        run: npm run test:unit
      - name: Run client end-to-end tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Run client end-to-end tests natively
        if: runner.os != 'Linux'
        run: npm run test:e2e

  vsix-package:
    name: vsix-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: editors/code
      - name: Package VSIX
        run: npm run package:vsix
        working-directory: editors/code
      - name: Verify packaged VSIX
        run: >-
          node -e "if (!require('node:fs').readdirSync('../../dist').some((name) => name.endsWith('.vsix')))
          throw new Error('Expected a host-native VSIX to be created')"
        working-directory: editors/code

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny@0.19.4
      - name: Run cargo deny
        run: cargo deny check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: mdbook@0.5.4
      - name: Build documentation
        run: mdbook build docs

  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    needs:
      - lints
      - tests
      - test-targets
      - compare-lsp-windows
      - client
      - vsix-package
      - docs
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
