name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR commits no longer need runners. Keep every main-branch run so
# cache refreshes and performance baselines can finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lints:
    name: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check release versions
        run: python3 .github/scripts/check_release_versions.py
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Zed WebAssembly target
        run: rustup target add wasm32-wasip2
      - name: Check Zed WebAssembly extension
        run: cargo check -p rust-glancer-zed --target wasm32-wasip2

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-nextest@0.9.132
      - name: Run tests
        run: cargo nextest run --workspace

  test-targets:
    name: test-targets
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/test-targets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cargo-cache
        with:
          scope: ci-${{ github.job }}
          target-dir: target/test-targets
          dependency-key: ${{ hashFiles('rust-toolchain.toml', 'test_targets/**/Cargo.lock', 'test_targets/**/Cargo.toml') }}
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: just@1.48.1
      - name: Check test targets
        run: just check-test-targets

  # Each platform owns its build dependency, so Linux and macOS consumers can
  # start without waiting for the Windows build in the matrix.
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/platform-checks.yml
    with:
      os: ${{ matrix.os }}

  # Not a part of blocking `pr-check`. We don't want PR to be randomly blocked on an advisory.
  # It's very rare that cargo deny fails because of a change in the PR, usually is's something
  # new that got published.
  # Red CI is annoying enough to care even if it doesn't block merging.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny@0.19.4
      - name: Run cargo deny
        run: cargo deny check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: mdbook@0.5.4
      - name: Build documentation
        run: mdbook build docs

  pr-checks:
    name: pr-checks
    # Report failed dependencies through the required check instead of skipping it.
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lints
      - tests
      - test-targets
      - platform
      - docs
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
