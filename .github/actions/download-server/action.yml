name: Download server
description: Download a server built by this workflow, preserving executable permissions.

inputs:
  name:
    description: Server artifact name.
    required: true
  path:
    description: Directory where the server executable should be extracted.
    default: target/release

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.name }}
        path: .ci/server-artifact
    - name: Extract server
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SERVER_DIRECTORY: ${{ inputs.path }}
      run: |
        mkdir -p "$SERVER_DIRECTORY"
        tar -xf .ci/server-artifact/rust-glancer.tar -C "$SERVER_DIRECTORY"
