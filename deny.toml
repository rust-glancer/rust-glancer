[advisories]
version = 2
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "ISC",
  "CC0-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
allow-git = [
  "https://github.com/rust-lang/rust-analyzer",
]
